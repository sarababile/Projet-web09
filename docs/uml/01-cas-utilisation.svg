<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="DejaVu Sans, Arial" font-size="15" fill="#0D1F16">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#14381F" stroke-width="1.4"/>
    </marker>
    <marker id="gen" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M1 1 L15 8 L1 15 Z" fill="#fff" stroke="#14381F" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1100" height="900" fill="#fff"/>
  <text x="550" y="28" text-anchor="middle" font-size="17">Diagramme de cas d'utilisation — AgriGestion</text>

  <!-- Système -->
  <rect x="270" y="50" width="800" height="830" rx="14" fill="#F3F7F0" stroke="#2E6B3F" stroke-width="1.6"/>
  <text x="1052" y="80" text-anchor="end" font-weight="bold" font-size="16" fill="#14381F">Système AgriGestion</text>

  <!-- Acteurs -->
  <g stroke="#14381F" stroke-width="2" fill="none">
    <circle cx="110" cy="130" r="15" fill="#E6F2E1"/>
    <line x1="110" y1="145" x2="110" y2="185"/><line x1="85" y1="160" x2="135" y2="160"/>
    <line x1="110" y1="185" x2="88" y2="220"/><line x1="110" y1="185" x2="132" y2="220"/>
    <circle cx="110" cy="490" r="15" fill="#E6F2E1"/>
    <line x1="110" y1="505" x2="110" y2="545"/><line x1="85" y1="520" x2="135" y2="520"/>
    <line x1="110" y1="545" x2="88" y2="580"/><line x1="110" y1="545" x2="132" y2="580"/>
  </g>
  <text x="110" y="244" text-anchor="middle" font-weight="bold">Visiteur</text>
  <text x="110" y="604" text-anchor="middle" font-weight="bold">Agriculteur</text>
  <text x="110" y="622" text-anchor="middle" font-size="12" fill="#4e6355">(utilisateur connecté)</text>
  <!-- Généralisation Agriculteur → Visiteur -->
  <line x1="110" y1="470" x2="110" y2="254" stroke="#14381F" stroke-width="1.5" marker-end="url(#gen)"/>

  <!-- Cas d'utilisation (colonne 1) -->
  <g fill="#E6F2E1" stroke="#2E6B3F" stroke-width="1.6">
    <ellipse cx="470" cy="120" rx="135" ry="30"/>
    <ellipse cx="470" cy="205" rx="135" ry="30"/>
    <ellipse cx="470" cy="315" rx="135" ry="30"/>
    <ellipse cx="470" cy="395" rx="135" ry="30"/>
    <ellipse cx="470" cy="475" rx="135" ry="30"/>
    <ellipse cx="470" cy="555" rx="135" ry="30"/>
    <ellipse cx="470" cy="635" rx="135" ry="30"/>
    <ellipse cx="470" cy="715" rx="135" ry="30"/>
    <ellipse cx="470" cy="805" rx="135" ry="30"/>
  </g>
  <g text-anchor="middle">
    <text x="470" y="125">S'inscrire</text>
    <text x="470" y="210">Se connecter</text>
    <text x="470" y="320">Se déconnecter</text>
    <text x="470" y="400">Consulter le tableau de bord</text>
    <text x="470" y="480">Gérer les parcelles</text>
    <text x="470" y="560">Gérer les cultures</text>
    <text x="470" y="640">Gérer les intrants</text>
    <text x="470" y="720">Gérer les récoltes</text>
    <text x="470" y="810">Consulter les rendements</text>
  </g>

  <!-- Cas d'utilisation (colonne 2) -->
  <g fill="#fff" stroke="#2E6B3F" stroke-width="1.6">
    <ellipse cx="870" cy="420" rx="130" ry="30"/>
    <ellipse cx="870" cy="535" rx="130" ry="30"/>
    <ellipse cx="870" cy="760" rx="130" ry="34"/>
  </g>
  <g text-anchor="middle">
    <text x="870" y="425">Rechercher une parcelle</text>
    <text x="870" y="540">Filtrer par parcelle / état</text>
    <text x="870" y="756">Calculer le rendement</text>
    <text x="870" y="775" font-size="13" fill="#4e6355">(kg/ha et DH/kg)</text>
  </g>

  <!-- Associations acteurs -->
  <g stroke="#14381F" stroke-width="1.4">
    <line x1="140" y1="150" x2="336" y2="122"/>
    <line x1="140" y1="168" x2="337" y2="200"/>
    <line x1="140" y1="520" x2="337" y2="318"/>
    <line x1="140" y1="522" x2="336" y2="398"/>
    <line x1="140" y1="526" x2="335" y2="477"/>
    <line x1="140" y1="530" x2="335" y2="553"/>
    <line x1="140" y1="534" x2="336" y2="632"/>
    <line x1="140" y1="538" x2="337" y2="711"/>
    <line x1="140" y1="542" x2="340" y2="800"/>
  </g>

  <!-- extend / include -->
  <g stroke="#14381F" stroke-width="1.4" stroke-dasharray="7 5" fill="none" marker-end="url(#open)">
    <line x1="742" y1="428" x2="605" y2="470"/>
    <line x1="740" y1="540" x2="606" y2="552"/>
    <line x1="604" y1="722" x2="742" y2="750"/>
    <line x1="604" y1="800" x2="742" y2="772"/>
  </g>
  <g font-size="13" fill="#2E6B3F" text-anchor="middle">
    <text x="680" y="433">«extend»</text>
    <text x="672" y="532">«extend»</text>
    <text x="668" y="723">«include»</text>
    <text x="668" y="808">«include»</text>
  </g>

  <!-- Notes -->
  <g>
    <path d="M700 110 H1030 V180 H700 Z" fill="#FFF8E6" stroke="#C9A86A" stroke-width="1.4"/>
    <text x="714" y="135" font-size="13">Les cas de l'Agriculteur nécessitent</text>
    <text x="714" y="154" font-size="13">d'être connecté (pages protégées,</text>
    <text x="714" y="173" font-size="13">jeton Laravel Sanctum).</text>
    <path d="M700 615 H1030 V665 H700 Z" fill="#FFF8E6" stroke="#C9A86A" stroke-width="1.4"/>
    <text x="714" y="637" font-size="13">« Gérer » = ajouter, consulter,</text>
    <text x="714" y="656" font-size="13">modifier, supprimer (CRUD).</text>
  </g>
</svg>
